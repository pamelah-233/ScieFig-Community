name: Community source checks

on:
  pull_request:
    paths:
      - 'main.py'
      - 'packaging/export_public_source.py'
      - 'tests/test_public_source.py'
      - 'tests/test_startup_splash.py'
      - 'ui/widgets/startup_splash.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-checks:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_public_source.py tests/test_startup_splash.py
