name: Build ScieFig macOS 1.2.5 DMG

on:
  push:
    branches: [macos-1.2.5]

permissions:
  contents: read

concurrency:
  group: macos-dmg-1.2.5
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 85
    env:
      MACOS_VERSION: '1.2.5'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare application and worker environments
        run: |
          test "$(uname -m)" = arm64
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pyinstaller==6.22.3
          python -m venv .venv-cellpose
          .venv-cellpose/bin/python -m pip install -r packaging/requirements-cellpose-macos.txt
      - name: Prepare offline models
        run: |
          mkdir -p build/macos/models
          # These pinned copies match the weights used in the verified local application.
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            https://huggingface.co/spaces/mouseland/cellpose/resolve/b97a37a6237a937c862ad6b6a0ab4ca7adf0925e/cyto3 \
            -o build/macos/models/cyto3
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            https://raw.githubusercontent.com/kevinjohncutler/omnipose-models/7730bdbf94d2e92d6f73b929c35d8870015eb682/nucleitorch_0 \
            -o build/macos/models/nucleitorch_0
          test "$(stat -f%z build/macos/models/cyto3)" = 26566255
          test "$(stat -f%z build/macos/models/nucleitorch_0)" = 26563614
      - name: Build bundled offline worker
        run: |
          .venv-cellpose/bin/python -m PyInstaller --noconfirm --onedir --console --name ScieFig_Cellpose \
            --distpath build/macos/worker --workpath build/macos/worker-work --specpath build/macos \
            --collect-all cellpose --copy-metadata cellpose --copy-metadata torch \
            --exclude-module pytest --exclude-module matplotlib --exclude-module pandas \
            --exclude-module IPython --exclude-module torchvision --exclude-module torchaudio \
            --exclude-module onnx --exclude-module onnxruntime \
            --add-data "$PWD/build/macos/models/cyto3:models" \
            --add-data "$PWD/build/macos/models/nucleitorch_0:models" \
            --add-data "$PWD/packaging/models:models" packaging/cellpose_worker.py
          .venv-cellpose/bin/python packaging/collect_cellpose_licenses.py build/macos/worker/ScieFig_Cellpose/THIRD_PARTY_LICENSES
          cp packaging/models/*.json packaging/models/*.yaml build/macos/worker/ScieFig_Cellpose/THIRD_PARTY_LICENSES/
          .venv/bin/python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import numpy as np
          y, x = np.mgrid[:128, :128]
          image = np.zeros((128, 128), dtype=np.float32)
          for cy, cx in ((32, 32), (32, 96), (96, 32), (96, 96)):
              image += np.exp(-((y-cy)**2+(x-cx)**2)/80).astype(np.float32)
          np.save('build/macos/worker-input.npy', image)
          for name in ('cyto3', 'nuclei', 'cyto3_dapi_reviewed_v1', 'cyto3_he_fiber_boundary_v1', 'cyto3_laminin_final_v1', 'truefad_myotube'):
              for device in ('cpu', 'mps'):
                  output = Path(f'build/macos/{name}-{device}-smoke.npy')
                  result = subprocess.run(['build/macos/worker/ScieFig_Cellpose/ScieFig_Cellpose',
                      'build/macos/worker-input.npy', str(output), '--model', name, '--min-size', '10',
                      '--device', device], capture_output=True, text=True)
                  assert result.returncode == 0, result.stderr
                  labels = np.load(output)
                  metadata = json.loads(output.with_suffix('.json').read_text())
                  assert labels.shape == image.shape and np.isfinite(labels).all()
                  if name != 'truefad_myotube':
                      assert labels.max() > 0
                  else:
                      assert metadata['output'] == 'native_center_response'
                  assert metadata['model'] == name and metadata['device'] == device
                  print(name, metadata['device'], int(labels.max()))
          PY
      - name: Verify focused macOS workflows
        timeout-minutes: 40
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/python -m pip install pytest-timeout==2.4.0
          # Fresh Qt application state per file avoids cumulative stylesheet costs.
          test_failed=0
          for test_file in tests/test_public_source.py tests/test_startup_splash.py tests/test_analysis_async.py tests/test_analysis_state_restore.py tests/test_measurement_history_panel.py tests/test_measurement_main_preview.py tests/test_module_defaults.py tests/test_model_device_feedback.py tests/test_model_device_selection.py tests/test_shared_cellpose_backend.py tests/test_composer_a_controls.py tests/test_ui_repairs_20260908.py tests/test_canvas_empty_copy.py tests/test_macos_port.py tests/test_macos_compact_toolbar.py tests/test_macos_workflow_tables.py tests/test_macos_style_workbench.py tests/test_measurement_provenance.py tests/test_rgb_import_composite.py tests/test_multiplex_spatial.py tests/test_project_welcome_dialog.py tests/test_io_engine.py tests/test_canvas_foundation.py tests/test_canvas_finish.py tests/test_histology_processing.py tests/test_fluoro_display_balance.py tests/test_measurement_freshness.py tests/test_spatial_results_model.py tests/test_brightfield_panel_analysis.py tests/test_ihc_image_analysis.py tests/test_he_fiber_boundary_choice.py tests/test_dapi_model_choice.py; do
            echo "Checking $test_file"
            .venv/bin/python -m pytest -q --timeout=120 --timeout-method=thread -p no:cacheprovider "$test_file" || test_failed=1
          done
          exit "$test_failed"
      - name: Compare real modern and legacy ND2 pixels
        run: |
          .venv/bin/python - <<'PY'
          import subprocess
          from pathlib import Path

          import imagecodecs
          import nd2
          import numpy as np
          from core.image_analysis.io_engine import read_image

          assert imagecodecs.JPEG2K.available
          folder = Path('build/macos/nd2')
          folder.mkdir(parents=True, exist_ok=True)
          for name, size in {'dims_c2y32x32.nd2': 331776, 'aryeh_b16_14_12.nd2': 24671709}.items():
              sample = folder / name
              subprocess.run(['curl', '-fL', '--retry', '3', '--max-time', '120',
                  f'https://github.com/tlambert03/nd2/releases/download/test-data/{name}',
                  '-o', str(sample)], check=True)
              assert sample.stat().st_size == size
              with nd2.ND2File(sample) as source:
                  expected = source.read_frame(0).copy()
              actual = read_image(sample).analysis_data
              assert actual.dtype == expected.dtype
              np.testing.assert_array_equal(actual, expected)
              print(name, actual.shape, actual.dtype, flush=True)
          PY
      - name: Build application
        run: |
          .venv/bin/python packaging/build_macos.py --worker-dir build/macos/worker/ScieFig_Cellpose --output "$RUNNER_TEMP/ScieFig-macos.noindex"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/ScieFig-macos.noindex/ScieFig.app/Contents/Info.plist")" = "$MACOS_VERSION"
          codesign --verify --deep --strict "$RUNNER_TEMP/ScieFig-macos.noindex/ScieFig.app"
      - name: Verify activation-free frozen startup and shutdown
        run: |
          cat > build/macos/verify_startup.py <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          app, output = map(Path, sys.argv[1:])
          output.mkdir(parents=True)
          for name, args in [('blank', []), ('wb', ['--wb-demo'])]:
              marker = output / f'{name}-ok.txt'
              faults = output / f'{name}-fault.txt'
              env = dict(os.environ, SCIEFIG_RELEASE_SMOKE='1',
                         SCIEFIG_RELEASE_SMOKE_MARKER=str(marker),
                         SCIEFIG_RELEASE_SMOKE_LOG=str(faults),
                         LOCALAPPDATA=str(output / name))
              result = subprocess.run([str(app / 'Contents/MacOS/ScieFig'), *args],
                                      env=env, timeout=120, capture_output=True, text=True)
              diagnostic = faults.read_text() if faults.exists() else 'missing fault log'
              assert result.returncode == 0 and diagnostic == '', (name, result.returncode, result.stderr, diagnostic)
              assert marker.read_text() == 'main-window-closed', name
              print(f'{name}: clean exit, empty fault log', flush=True)
          PY
          .venv/bin/python build/macos/verify_startup.py "$RUNNER_TEMP/ScieFig-macos.noindex/ScieFig.app" build/macos/frozen-startup
      - name: Build and verify DMG
        run: |
          mkdir -p artifacts/macos
          ln -s /Applications "$RUNNER_TEMP/ScieFig-macos.noindex/Applications"
          hdiutil create -volname "ScieFig ${MACOS_VERSION}" -srcfolder "$RUNNER_TEMP/ScieFig-macos.noindex" \
            -format UDZO -fs HFS+ "artifacts/macos/ScieFig_${MACOS_VERSION}_macOS_arm64.dmg"
          hdiutil verify "artifacts/macos/ScieFig_${MACOS_VERSION}_macOS_arm64.dmg"
      - name: Verify the application copied from the DMG
        run: |
          set -eu
          mount="$RUNNER_TEMP/ScieFig-125-mount"
          installed="$RUNNER_TEMP/ScieFig-125-installed"
          mkdir -p "$mount" "$installed"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "artifacts/macos/ScieFig_${MACOS_VERSION}_macOS_arm64.dmg"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/ScieFig.app" "$installed/ScieFig.app"
          test "$(readlink "$mount/Applications")" = /Applications
          codesign --verify --deep --strict "$installed/ScieFig.app"
          test "$(lipo -archs "$installed/ScieFig.app/Contents/MacOS/ScieFig")" = arm64
          .venv/bin/python build/macos/verify_startup.py "$installed/ScieFig.app" build/macos/installed-startup
          worker="$installed/ScieFig.app/Contents/Resources/cellpose/ScieFig_Cellpose"
          for device in cpu mps; do
            "$worker" build/macos/worker-input.npy "build/macos/installed-$device.npy" --device "$device" --model cyto3 --min-size 10
          done
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          import numpy as np

          for device in ('cpu', 'mps'):
              base = Path(f'build/macos/installed-{device}')
              labels = np.load(base.with_suffix('.npy'))
              result = json.loads(base.with_suffix('.json').read_text())
              assert labels.shape == (128, 128) and np.isfinite(labels).all() and labels.max() > 0
              assert result['device'] == device and result['model'] == 'cyto3'
          manifest = {'commit': os.environ['GITHUB_SHA'], 'version': os.environ['MACOS_VERSION'],
                      'architecture': 'arm64', 'installed_devices': ['cpu', 'mps']}
          Path('artifacts/macos/macos-candidate.json').write_text(json.dumps(manifest))
          PY
      - name: Retain macOS DMG
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ScieFig-1.2.5-macOS-arm64
          path: artifacts/macos/*
          if-no-files-found: error
          compression-level: 0
