name: Add verified Windows 1.2.3 installers

on:
  push:
    branches: [windows-1.2.3-publish]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-windows-1.2.3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '41844231258'
      SOURCE_COMMIT: '0e6d30ea01d9afe3ac25dca935e987401d271137'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check publication edits
        run: python -m unittest discover -s tests -p test_windows_publication.py
      - name: Download verified build artifact
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name ScieFig-1.2.3-Windows-installers --dir artifacts/windows
      - name: Add Windows downloads to the existing release
        run: |
          python packaging/publish_windows_123.py "$GITHUB_REPOSITORY" "$SOURCE_RUN" "$SOURCE_COMMIT" artifacts/windows
      - name: Retain publication verification
        uses: actions/upload-artifact@v4
        with:
          name: ScieFig-1.2.3-Windows-publication
          path: artifacts/windows/publication-check.json
          retention-days: 30
